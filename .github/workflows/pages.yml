# Publishes src/ to GitHub Pages.
#
# The Pages "branch" source can only serve / (root) or /docs — there is no
# arbitrary-folder option — so serving from src/ is done with this workflow
# instead. Set Settings → Pages → Source to "GitHub Actions".
#
# Actions minutes are free for public repositories.
name: Deploy site to Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; never cancel one already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
